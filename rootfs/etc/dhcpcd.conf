# dhcpcd service: DHCP on every Ethernet and Wi-Fi interface, including
# interfaces and links that appear after boot. Apply edits with:
# rc-service dhcpcd restart
allowinterfaces eth* en* wlan*

# Exclude an interface (denyinterfaces wins over allowinterfaces), then
# configure it in /etc/network/interfaces or by hand:
# denyinterfaces eth1

# Static address for one interface instead of DHCP:
# interface eth1
# static ip_address=192.168.1.100/24
# static routers=192.168.1.1
# static domain_name_servers=192.168.1.1

hostname
clientid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
noipv4ll
noipv6
nohook wpa_supplicant
